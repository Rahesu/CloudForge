spring.application.name=demo

jwt.secret=${JWT_SECRET}

spring.datasource.url=jdbc:mysql://localhost:3306/cloudforge
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.kafka.bootstrap-servers=localhost:9092


# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# Consumer
spring.kafka.consumer.group-id=cloudforge-activity-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.cloudforge.application.event
spring.kafka.consumer.properties[spring.json.value.default.type]=com.cloudforge.application.event.ActivityEvent
spring.kafka.consumer.properties[spring.json.use.type.headers]=false

# Producer delivery reliability
spring.kafka.producer.acks=all
spring.kafka.producer.retries=5
spring.kafka.producer.properties[enable.idempotence]=true
spring.kafka.producer.properties[delivery.timeout.ms]=120000
spring.kafka.producer.properties[request.timeout.ms]=30000